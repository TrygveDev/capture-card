name: Release

# Push a tag matching Cargo.toml's version (v0.2.0) to publish a release. The installed app
# updates itself from the latest release: it downloads passthru.exe and checks it against
# passthru.exe.sha256.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml's version $v" }
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/passthru.exe passthru.exe
          $hash = (Get-FileHash passthru.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/passthru.exe.sha256", "$hash  passthru.exe`n")
          Get-Content passthru.exe.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" passthru.exe passthru.exe.sha256 --title "Passthru ${{ github.ref_name }}" --generate-notes
