[package]
name = "passthru"
version = "0.2.1"
edition = "2024"
description = "Lightweight, low-latency capture card viewer with GPU frame generation"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/TrygveDev/passthru"

[dependencies]
gpui = "0.2.2"
image = { version = "0.25", default-features = false }
anyhow = "1"
futures = "0.3"
raw-window-handle = "0.6"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For #[implement] (the source reader's callback); the same version `windows` uses.
windows-core = "0.61"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Registry",
    "Win32_Storage_EnhancedStorage",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

# gpui and the pixel converter are unusably slow unoptimised, so even dev builds optimise.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
# No `panic = "abort"`: tests can't use it, so with it `cargo test --release` and `cargo build
# --release` each compiled every dependency (twice the CI time). A panic still ends the app:
# see `log::exit_on_panic`.

[build-dependencies]
winresource = "0.1"
