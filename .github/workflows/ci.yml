name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One cache for CI and releases. Saved from main only: a release (on a tag) restores
      # main's, so it compiles just Passthru itself, not every dependency.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: passthru
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Keep the exe
        uses: actions/upload-artifact@v4
        with:
          name: passthru-${{ github.sha }}
          path: target/release/passthru.exe
          retention-days: 14
